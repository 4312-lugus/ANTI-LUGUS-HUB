<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Paint simple</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

#toolbar {
  display: flex;
  gap: 10px;
  padding: 10px;
  background: #222;
  color: white;
  align-items: center;
}

button, input {
  padding: 5px;
}

canvas {
  flex: 1;
  border-top: 2px solid #444;
  cursor: crosshair;
}
</style>
</head>
<body>

<div id="toolbar">
  <label>Color: <input type="color" id="color" value="#000000"></label>
  <label>Grosor: <input type="range" id="size" min="1" max="50" value="5"></label>
  <button onclick="clearCanvas()">Borrar</button>
  <button onclick="saveImage()">Guardar</button>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight - document.getElementById('toolbar').offsetHeight;
}
window.addEventListener('resize', resize);
resize();

let painting = false;

canvas.addEventListener('mousedown', () => painting = true);
canvas.addEventListener('mouseup', () => {
  painting = false;
  ctx.beginPath();
});
canvas.addEventListener('mousemove', draw);

function draw(e) {
  if (!painting) return;

  ctx.lineWidth = document.getElementById('size').value;
  ctx.lineCap = 'round';
  ctx.strokeStyle = document.getElementById('color').value;

  ctx.lineTo(e.clientX, e.clientY - document.getElementById('toolbar').offsetHeight);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(e.clientX, e.clientY - document.getElementById('toolbar').offsetHeight);
}

function clearCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function saveImage() {
  const link = document.createElement('a');
  link.download = 'mi-paint.png';
  link.href = canvas.toDataURL();
  link.click();
}
</script>

</body>
</html>
