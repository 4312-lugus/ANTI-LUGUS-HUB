<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"></stop>
      <stop offset="100%" stop-color="#00ff7f"></stop>
    </linearGradient>
  </defs>

  <!-- space background -->
  <rect width="256" height="256" rx="40" fill="#0b1020"></rect>

  <!-- stars -->
  <circle cx="50" cy="60" r="3" fill="white"></circle>
  <circle cx="200" cy="80" r="2" fill="white"></circle>
  <circle cx="180" cy="180" r="3" fill="white"></circle>
  <circle cx="70" cy="170" r="2" fill="white"></circle>
  <circle cx="130" cy="40" r="2" fill="white"></circle>

  <!-- ship -->
  <polygon points="128,60 160,170 128,150 96,170" fill="url(#s)"></polygon>

  <!-- glow engine -->
  <circle cx="128" cy="175" r="10" fill="#00ff7f"></circle>
</svg>